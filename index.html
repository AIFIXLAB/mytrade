<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>US Gap Scanner</title>
<style>
:root{--bg:#0b0f17;--card:#141b29;--line:#222c3f;--tx:#e8edf6;--mu:#8793ab;--up:#16c784;--dn:#ea3943;--ac:#5b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,Segoe UI,Sarabun,sans-serif;padding:env(safe-area-inset-top) 0 90px}
header{padding:16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}small,.mu{color:var(--mu);font-size:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px}
.wrap{padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sym{font-weight:700;font-size:16px}.up{color:var(--up)}.dn{color:var(--dn)}
.btn{background:linear-gradient(135deg,#5b8cff,#8a5bff);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;width:100%}
.btn2{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input{background:#0e1421;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:15px;width:100%;margin:4px 0}
.score{min-width:44px;text-align:center;border-radius:10px;padding:6px 0;font-weight:800;font-size:17px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d1320ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font-size:11px}nav button b{display:block;font-size:20px}
nav button.on{color:var(--ac)}.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:#1d2740;color:#9db4ff;margin-right:4px}
.bar{height:5px;background:#1d2740;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--up)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}#modal .sheet{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
a{color:var(--ac);text-decoration:none}.n{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
textarea{background:#0e1421;border:1px solid #222c3f;color:#e8edf6;border-radius:10px;padding:10px;font-size:14px;width:100%;margin:4px 0;min-height:90px}</style></head><body>
<header><div><h1>🚀 US Gap Scanner</h1><small id="clock"></small></div><span class="pill" id="fx">USD/THB …</span></header>
<div class="wrap" id="app"></div>
<div id="modal" onclick="if(event.target===this)this.style.display='none'"><div class="sheet" id="sheet"></div></div>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const cfg=()=>LS('cfg')||{};let sb=null,FX=35,tab='scan',scan=LS('lastScan')||[];
function initSb(){const c=cfg();try{if(c.sbu&&c.sbk)sb=supabase.createClient(c.sbu,c.sbk)}catch(e){}}
async function A(mode,q=''){let r,d;try{r=await fetch(`/api/market?mode=${mode}&${q}`);d=await r.json()}catch(e){throw Error('เรียก /api/market ไม่ได้ ต้องอัปโหลดทั้ง index.html และโฟลเดอร์ api ขึ้น Vercel')}
 if(!r.ok||d.error)throw Error(d.error||'API '+r.status);return d}
const f=(n,d=2)=>n==null||isNaN(n)?'-':(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=n=>n==null?'-':`<span class="${n>=0?'up':'dn'}">${n>=0?'+':''}${f(n)}%</span>`;
const today=()=>new Date().toISOString().slice(0,10),cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const cap=n=>!n?'-':n>=1e9?f(n/1e9,1)+'B':f(n/1e6,0)+'M';
const dt=t=>new Date(t*1000).toISOString().slice(0,10);
const POS='surge,surges,beat,beats,upgrade,upgraded,record,growth,soar,soars,jump,jumps,approval,approved,partnership,contract,raises,raised,profit,bullish,breakout,buyback,wins,launch,strong,rally,rallies,deal,acquire,acquisition,boost,top'.split(','),
NEG='miss,misses,downgrade,downgraded,lawsuit,probe,plunge,plunges,fall,falls,cut,cuts,loss,bearish,offering,dilution,recall,fraud,halt,decline,weak,warning,investigation,delist,sinks,drops,tumble,slump'.split(',');
function sent(ns){let s=0;(ns||[]).forEach(n=>{const w=(n.title||'').toLowerCase().split(/[^a-z]+/);w.forEach(x=>{if(POS.includes(x))s++;if(NEG.includes(x))s--})});return s}
function score(x){const gap=x.pre!=null?x.pre:x.chg,g=cl(gap,0,15)/15*40,rv=x.avgVol?cl(x.vol/x.avgVol,0,5)/5*25:0,n=cl(x.sent,-4,4)/4*25,p=(x.price>=2?5:0)+(x.mcap>3e8?5:0);return Math.round(cl(g+rv+n+p,0,100))}
const sc=s=>s>=60?'background:#12432f;color:#16c784':s>=40?'background:#4a3b12;color:#f5b942':'background:#3a1a1d;color:#ea3943';
async function doScan(){const el=$('#st');el.textContent='กำลังสแกนตลาด…';
 try{const{list}=await A('scan');list.forEach(x=>{x.news=x.news||[];x.sent=sent(x.news);x.rv=x.avgVol?x.vol/x.avgVol:null;x.score=score(x)});list.sort((a,b)=>b.score-a.score);
  if(!list.length)throw Error('ไม่พบหุ้น');scan=list;LS('lastScan',list);LS('scanTime',new Date().toLocaleString('th-TH'));saveRank(list);render()}
 catch(e){el.innerHTML='⚠️ '+e.message}}
async function saveRank(o){const d=today(),rows=o.slice(0,15).map((x,i)=>({day:d,sym:x.sym,rank:i+1,score:x.score,gap:x.pre!=null?x.pre:x.chg,price:x.price}));
 const h=LS('rank')||{};h[d]=rows;LS('rank',h);if(sb)try{await sb.from('rankings').upsert(rows,{onConflict:'day,sym'})}catch(e){}}
async function getPort(){if(sb)try{const{data,error}=await sb.from('portfolio').select('*');if(!error)return data}catch(e){}return LS('port')||[]}
async function addPos(){const s=$('#ps').value.trim().toUpperCase(),n=+$('#pn').value,c=+$('#pc').value;if(!s||!n||!c)return;
 if(sb){const{error}=await sb.from('portfolio').insert({sym:s,shares:n,cost:c});if(!error)return render()}
 const p=LS('port')||[];p.push({id:Date.now(),sym:s,shares:n,cost:c});LS('port',p);render()}
async function delPos(id){if(sb){await sb.from('portfolio').delete().eq('id',id)}LS('port',(LS('port')||[]).filter(x=>x.id!=id));render()}
async function chart(sym,cost){$('#modal').style.display='flex';$('#sheet').innerHTML='โหลด…';
 try{const[c,nw]=await Promise.all([A('chart','symbol='+sym),A('news','symbol='+sym).catch(()=>({news:[]}))]),v=c.c.slice(-90),t=c.t.slice(-90),ns=nw.news,W=340,H=170;
  const mn=Math.min(...v,cost||1e9),mx=Math.max(...v,cost||0),X=i=>i/(v.length-1)*W,Y=y=>H-(y-mn)/(mx-mn||1)*H,up=v[v.length-1]>=v[0];
  const pl=cost?(c.price-cost)/cost*100:null;
  $('#sheet').innerHTML=`<div class="row"><div><b class="sym">${sym}</b> $${f(c.price)}</div><button class="btn2" onclick="$('#modal').style.display='none'">ปิด</button></div>
  ${cost?`<div>ต้นทุน $${f(cost)} · ตอนนี้ ${pc(pl)}</div>`:''}
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="margin:10px 0"><polyline points="${v.map((y,i)=>X(i)+','+Y(y)).join(' ')}" fill="none" stroke="${up?'#16c784':'#ea3943'}" stroke-width="2"/>${cost?`<line x1="0" x2="${W}" y1="${Y(cost)}" y2="${Y(cost)}" stroke="#f5b942" stroke-dasharray="4"/><text x="4" y="${Y(cost)-4}" fill="#f5b942" font-size="10">ต้นทุน $${f(cost)}</text>`:''}</svg>
  <div class="row mu"><span>${dt(t[0])}</span><span>ต่ำ $${f(Math.min(...v))} · สูง $${f(Math.max(...v))}</span><span>${dt(t[t.length-1])}</span></div>
  <h4>ข่าวล่าสุด (คะแนน ${sent(ns)>=0?'+':''}${sent(ns)})</h4>`+(ns.map(n=>`<div class="n"><a href="${n.url}" target="_blank">${n.title}</a><br><small>${n.site||''} · ${n.t?dt(n.t):''}</small></div>`).join('')||'<small>ไม่มีข่าว</small>')
 }catch(e){$('#sheet').innerHTML='⚠️ '+e.message}}
const views={
 scan(){const t=LS('scanTime');return `<button class="btn" onclick="doScan()">🔍 สแกนหุ้นมาแรง</button><div class="mu" style="margin:8px 0" id="st">${t?'อัปเดตล่าสุด '+t:'กดสแกนก่อนตลาดเปิด 20:30 น.'}</div>`+
 scan.map((x,i)=>`<div class="card" onclick="chart('${x.sym}')"><div class="row"><div><span class="mu">#${i+1}</span> <span class="sym">${x.sym}</span><br><small>${(x.name||'').slice(0,26)}</small></div><div style="text-align:right">$${f(x.price)}<br>${pc(x.chg)}</div><div class="score" style="${sc(x.score)}">${x.score}</div></div>
 <div class="bar"><i style="width:${x.score}%"></i></div><div style="margin-top:6px">${x.pre!=null?`<span class="tag" style="color:#f5b942">PRE ${x.pre>=0?'+':''}${f(x.pre)}%</span>`:''}<span class="tag">ข่าว ${x.sent>=0?'+':''}${x.sent}</span>${x.rv?`<span class="tag">Vol x${f(x.rv,1)}</span>`:''}<span class="tag">Cap ${cap(x.mcap)}</span></div>
 ${x.news&&x.news[0]?`<div class="mu" style="margin-top:6px">📰 ${x.news[0].title}</div>`:''}</div>`).join('')},
 async ipo(){try{const{list}=await A('ipo'),g=s=>list.filter(x=>x.status===s&&x.sym),card=x=>`<div class="card"><div class="row"><span class="sym">${x.sym}</span><span class="pill">${x.date||'-'}</span></div><div>${x.name||''}</div><small>${x.ex||''} · ราคา ${x.price||'-'} ${x.shares?'· '+x.shares+' หุ้น':''}</small></div>`;
  const sec=(t,a)=>a.length?`<h3>${t}</h3>`+a.map(card).join(''):'';
  return sec('📅 กำลังจะเข้าเทรด',g('upcoming'))+sec('✅ เพิ่งกำหนดราคา',g('priced').slice(0,10))+sec('🌱 ยื่นไฟลิ่งแล้ว (ต้นน้ำ)',g('filed').slice(0,12))||'<div class="card mu">ไม่พบข้อมูล</div>'}catch(e){return '⚠️ '+e.message}},
 async rank(){let h=LS('rank')||{};if(sb)try{const{data}=await sb.from('rankings').select('*').order('day',{ascending:false}).limit(300);(data||[]).forEach(r=>{(h[r.day]=h[r.day]||[]);if(!h[r.day].find(z=>z.sym===r.sym))h[r.day].push(r)})}catch(e){}
  const days=Object.keys(h).filter(d=>h[d].length).sort().reverse();return `<h3>🏆 อันดับรายวัน</h3>`+(days.length?days.map(d=>`<div class="card"><b>${d}</b>`+h[d].sort((a,b)=>a.rank-b.rank).slice(0,10).map(r=>`<div class="row n"><span>#${r.rank} <b>${r.sym}</b></span><span>${pc(r.gap)}</span><span class="score" style="${sc(r.score)};min-width:36px;font-size:14px">${r.score}</span></div>`).join('')+`</div>`).join(''):'<div class="card mu">ยังไม่มีข้อมูล สแกนก่อนนะ</div>')},
 async port(){const p=await getPort();let q={};if(p.length)try{q=(await A('quote','symbols='+[...new Set(p.map(x=>x.sym))].join(','))).quotes}catch(e){}
  let tc=0,tv=0;const rows=p.map(x=>{const pr=q[x.sym]?.price,c=x.shares*x.cost,v=pr?x.shares*pr:0;tc+=c;tv+=v;const pl=v-c;return `<div class="card"><div class="row" onclick="chart('${x.sym}',${x.cost})"><div><span class="sym">${x.sym}</span><br><small>${x.shares} หุ้น @ $${f(x.cost)}</small></div><div style="text-align:right">$${f(pr)}<br><span class="${pl>=0?'up':'dn'}">${pl>=0?'+':''}$${f(pl)} (${f(pl/c*100)}%)</span><br><small class="${pl>=0?'up':'dn'}">≈ ฿${f(pl*FX,0)}</small></div></div><button class="btn2" style="margin-top:8px" onclick="delPos('${x.id}')">ลบ</button></div>`}).join(''),pl=tv-tc;
  return `<div class="card"><small>มูลค่ารวม</small><div style="font-size:24px;font-weight:700">$${f(tv)} <small>฿${f(tv*FX,0)}</small></div><div class="${pl>=0?'up':'dn'}">กำไร/ขาดทุน ${pl>=0?'+':''}$${f(pl)} · ฿${f(pl*FX,0)} (${tc?f(pl/tc*100):'0.00'}%)</div></div>
  <div class="card"><b>เพิ่มหุ้น</b><input id="ps" placeholder="Ticker เช่น NVDA"><input id="pn" type="number" placeholder="จำนวนหุ้น"><input id="pc" type="number" step="any" placeholder="ราคาซื้อเฉลี่ย (USD)"><button class="btn" onclick="addPos()">+ เพิ่ม</button></div>`+rows},
 set(){const c=cfg();return `<div class="card"><b>Supabase URL (ไม่บังคับ)</b><input id="k2" value="${c.sbu||''}" placeholder="https://xxx.supabase.co"><b>Supabase anon key</b><input id="k3" value="${c.sbk||''}"><button class="btn" onclick="saveCfg()">บันทึก</button><p class="mu">ถ้าไม่ใส่ Supabase ข้อมูลจะเก็บในเครื่องนี้แทน<br>ข้อมูลตลาดมาจาก Yahoo Finance / Nasdaq ผ่าน /api/market ไม่ต้องใช้ API key<br>⚠️ คะแนนเป็นเพียงเครื่องมือช่วยคัดกรอง ไม่ใช่คำแนะนำลงทุน</p></div>`}};
function saveCfg(){LS('cfg',{sbu:$('#k2').value.trim(),sbk:$('#k3').value.trim()});initSb();tab='scan';render()}
const T=[['scan','📈','สแกน'],['ipo','🆕','IPO'],['rank','🏆','อันดับ'],['port','💼','พอร์ต'],['set','⚙️','ตั้งค่า']];
async function render(){$('#nav').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('#app').innerHTML='โหลด…';$('#app').innerHTML=await views[tab]()}
function clock(){const n=new Date(),th=n.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'}),ny=new Date(n.toLocaleString('en-US',{timeZone:'America/New_York'})),m=ny.getHours()*60+ny.getMinutes(),wd=ny.getDay()%6!==0,
 s=!wd?'ปิด (วันหยุด)':m>=570&&m<960?'🟢 ตลาดเปิด':m>=240&&m<570?'🟡 Pre-market':'⚫ ปิด';$('#clock').textContent=`ไทย ${th} · ${s} · เปิด 20:30 (ช่วง DST)`}
fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()).then(d=>{FX=d.rates.THB;$('#fx').textContent='USD/THB '+f(FX);if(tab==='port')render()}).catch(()=>{});
initSb();clock();setInterval(clock,30000);render();
</script></body></html>
